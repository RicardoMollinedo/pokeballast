# Shared by the HTTP (80) and HTTPS (443) servers.

# same-origin API: the browser never calls the backend directly, so no CORS is needed
location /api/ {
    proxy_pass http://api:8080;
    # $http_host keeps the port the browser used, so the API builds correct absolute URLs (Location header)
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Strict-Transport-Security $hsts always;
}

# hashed build assets can be cached forever
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security $hsts always;
}

# SPA fallback: client-side routes (/collection, /pokemon/25...) are served index.html
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts always;
}
