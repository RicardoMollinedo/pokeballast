# HSTS only over HTTPS (an empty value means nginx does not send the header)
map $scheme $hsts {
    https   "max-age=31536000";
    default "";
}

# HTTP: convenient for local demos. In production, expose only 443 and redirect here:
#   return 301 https://$host$request_uri;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/snippets/locations.conf;
}

# HTTPS: TLS terminates here; the hop to the API stays inside the Docker network.
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # generated at startup if missing (docker/generate-self-signed-cert.sh); mount real ones over /etc/nginx/certs
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    include /etc/nginx/snippets/locations.conf;
}
